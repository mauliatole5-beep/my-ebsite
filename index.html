<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Student Result Portal</h1>
    <p>Student Academic Result System</p>
</header>

<div class="container">

    <h2>Enter Student Details</h2>

    <label>Student Name</label>
    <input type="text" id="name" placeholder="Enter name">

    <label>Roll Number</label>
    <input type="text" id="roll" placeholder="Enter roll number">

    <label>Python Marks</label>
    <input type="number" id="python" min="0" max="100">

    <label>Web Development Marks</label>
    <input type="number" id="web" min="0" max="100">

    <label>Database Marks</label>
    <input type="number" id="database" min="0" max="100">

    <label>Mathematics Marks</label>
    <input type="number" id="maths" min="0" max="100">

    <label>English Marks</label>
    <input type="number" id="english" min="0" max="100">

    <button onclick="calculateResult()">
        Calculate Result
    </button>

    <div id="result">

        <h2>📄 Result</h2>

        <div class="result-line">
            <strong>Name:</strong>
            <span id="resultName"></span>
        </div>

        <div class="result-line">
            <strong>Roll No:</strong>
            <span id="resultRoll"></span>
        </div>

        <div class="result-line">
            <strong>Total:</strong>
            <span id="total"></span>
        </div>

        <div class="result-line">
            <strong>Percentage:</strong>
            <span id="percentage"></span>
        </div>

        <div class="result-line">
            <strong>Grade:</strong>
            <span id="grade"></span>
        </div>

    </div>

</div>

<script>

function calculateResult() {

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;

    let python = Number(document.getElementById("python").value);
    let web = Number(document.getElementById("web").value);
    let database = Number(document.getElementById("database").value);
    let maths = Number(document.getElementById("maths").value);
    let english = Number(document.getElementById("english").value);

    let total = python + web + database + maths + english;

    let percentage = total / 5;

    let grade;

    if (percentage >= 90) {
        grade = "A+";
    }
    else if (percentage >= 80) {
        grade = "A";
    }
    else if (percentage >= 70) {
        grade = "B";
    }
    else if (percentage >= 60) {
        grade = "C";
    }
    else if (percentage >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    document.getElementById("resultName").innerText = name;
    document.getElementById("resultRoll").innerText = roll;
    document.getElementById("total").innerText = total + " / 500";
    document.getElementById("percentage").innerText = percentage + "%";
    document.getElementById("grade").innerText = grade;

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
